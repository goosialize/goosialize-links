en:
  PLUGIN_GOOSIALIZE_LINKS:
    NAME: Goosialize Links
    DESCRIPTION: Self-hosted Link in Bio plugin for Grav CMS.
    STATUS: Plugin status
    STATUS_HELP: Enable or disable Goosialize Links.
    ENABLED: Enabled
    DISABLED: Disabled
    ICU:
      ROUTE: Public route
      ROUTE_HELP: Choose the URL path for the single public Link in Bio page.
      PROFILE_SECTION: Profile
      PROFILE_IMAGE: Profile image
      PROFILE_IMAGE_HELP: Upload one JPEG, PNG or WebP image. SVG files are not accepted.
      PROFILE_NAME: Name or brand
      PROFILE_NAME_HELP: The primary name displayed at the top of the page.
      PROFILE_TITLE: Title
      PROFILE_TITLE_HELP: A short line displayed below the name or brand.
      PROFILE_DESCRIPTION: Description
      PROFILE_DESCRIPTION_HELP: A short introduction displayed on the public page.
      PROFILE_WEBSITE_URL: Website URL
      PROFILE_WEBSITE_URL_HELP: An optional link to the primary website.
      APPEARANCE_SECTION: Appearance
      THEME: Theme
      THEME_HELP: Select one of the three included FREE themes.
      THEME_LIGHT: Light
      THEME_DARK: Dark
      THEME_SUNRISE: Sunrise
      ACCENT: Accent color
      ACCENT_HELP: Select the accent used for the avatar, actions and focus states.
      ACCENT_YELLOW: Yellow
      ACCENT_BLUE: Blue
      ACCENT_CORAL: Coral
      ACCENT_GREEN: Green
      ACCENT_PURPLE: Purple
      BUTTON_SHAPE: Button shape
      BUTTON_SHAPE_HELP: Select the shape used for primary link buttons.
      BUTTON_SQUARE: Square
      BUTTON_ROUNDED: Rounded
      BUTTON_PILL: Pill
      ACTIONS_SECTION: Social and contact actions
      ACTIONS: Actions
      ACTIONS_HELP: Add social profiles and direct contact actions.
      ADD_ACTION: Add action
      ACTION_ENABLED: Active
      ACTION_TYPE: Action type
      ACTION_VALUE: URL, email or phone
      ACTION_VALUE_HELP: Enter an HTTP or HTTPS URL, email address, telephone number or WhatsApp number that matches the selected type.
      ACTION_LABEL: Custom label
      ACTION_LABEL_HELP: Leave empty to use the standard platform label.
      ACTION_WEBSITE: Website
      ACTION_INSTAGRAM: Instagram
      ACTION_FACEBOOK: Facebook
      ACTION_TIKTOK: TikTok
      ACTION_YOUTUBE: YouTube
      ACTION_LINKEDIN: LinkedIn
      ACTION_X: X
      ACTION_EMAIL: Email
      ACTION_PHONE: Phone
      ACTION_WHATSAPP: WhatsApp
      LINKS_SECTION: Links
      LINKS: Page links
      LINKS_HELP: Add, remove and reorder links, with up to eight active links in the FREE edition.
      ADD_LINK: Add link
      LINK_ENABLED: Active
      LINK_TITLE: Link title
      LINK_TITLE_HELP: The text displayed on the public link button.
      LINK_URL: Link URL
      LINK_URL_HELP: The absolute HTTP or HTTPS destination.
      LINK_NEW_TAB: Open in new tab
      LINK_NEW_TAB_HELP: Open the destination in a separate browser tab.

el:
  PLUGIN_GOOSIALIZE_LINKS:
    NAME: Goosialize Links
    DESCRIPTION: Αυτοφιλοξενούμενο Link in Bio plugin για το Grav CMS.
    STATUS: Κατάσταση plugin
    STATUS_HELP: Ενεργοποιήστε ή απενεργοποιήστε το Goosialize Links.
    ENABLED: Ενεργό
    DISABLED: Ανενεργό
    ICU:
      ROUTE: Δημόσια διαδρομή
      ROUTE_HELP: Επιλέξτε τη διαδρομή URL της μοναδικής δημόσιας Link in Bio σελίδας.
      PROFILE_SECTION: Προφίλ
      PROFILE_IMAGE: Εικόνα προφίλ
      PROFILE_IMAGE_HELP: Ανεβάστε μία εικόνα JPEG, PNG ή WebP. Τα SVG δεν επιτρέπονται.
      PROFILE_NAME: Όνομα ή brand
      PROFILE_NAME_HELP: Το βασικό όνομα που εμφανίζεται στην κορυφή της σελίδας.
      PROFILE_TITLE: Τίτλος
      PROFILE_TITLE_HELP: Μία σύντομη γραμμή κάτω από το όνομα ή το brand.
      PROFILE_DESCRIPTION: Περιγραφή
      PROFILE_DESCRIPTION_HELP: Μία σύντομη εισαγωγή για τη δημόσια σελίδα.
      PROFILE_WEBSITE_URL: URL ιστοσελίδας
      PROFILE_WEBSITE_URL_HELP: Προαιρετικός σύνδεσμος προς την κύρια ιστοσελίδα.
      APPEARANCE_SECTION: Εμφάνιση
      THEME: Theme
      THEME_HELP: Επιλέξτε ένα από τα τρία themes της FREE έκδοσης.
      THEME_LIGHT: Light
      THEME_DARK: Dark
      THEME_SUNRISE: Sunrise
      ACCENT: Χρώμα έμφασης
      ACCENT_HELP: Επιλέξτε το χρώμα του avatar, των actions και των focus states.
      ACCENT_YELLOW: Κίτρινο
      ACCENT_BLUE: Μπλε
      ACCENT_CORAL: Coral
      ACCENT_GREEN: Πράσινο
      ACCENT_PURPLE: Μωβ
      BUTTON_SHAPE: Σχήμα κουμπιών
      BUTTON_SHAPE_HELP: Επιλέξτε το σχήμα των βασικών link buttons.
      BUTTON_SQUARE: Τετράγωνα
      BUTTON_ROUNDED: Στρογγυλεμένα
      BUTTON_PILL: Pill
      ACTIONS_SECTION: Social και contact actions
      ACTIONS: Actions
      ACTIONS_HELP: Προσθέστε social profiles και άμεσους τρόπους επικοινωνίας.
      ADD_ACTION: Προσθήκη action
      ACTION_ENABLED: Ενεργό
      ACTION_TYPE: Τύπος action
      ACTION_VALUE: URL, email ή τηλέφωνο
      ACTION_VALUE_HELP: Εισαγάγετε HTTP ή HTTPS URL, email, τηλέφωνο ή αριθμό WhatsApp που αντιστοιχεί στον επιλεγμένο τύπο.
      ACTION_LABEL: Προσαρμοσμένο label
      ACTION_LABEL_HELP: Αφήστε το κενό για να χρησιμοποιηθεί το κανονικό όνομα της πλατφόρμας.
      ACTION_WEBSITE: Website
      ACTION_INSTAGRAM: Instagram
      ACTION_FACEBOOK: Facebook
      ACTION_TIKTOK: TikTok
      ACTION_YOUTUBE: YouTube
      ACTION_LINKEDIN: LinkedIn
      ACTION_X: X
      ACTION_EMAIL: Email
      ACTION_PHONE: Τηλέφωνο
      ACTION_WHATSAPP: WhatsApp
      LINKS_SECTION: Σύνδεσμοι
      LINKS: Σύνδεσμοι σελίδας
      LINKS_HELP: Προσθέστε, αφαιρέστε και ταξινομήστε συνδέσμους, με έως οκτώ ενεργούς συνδέσμους στη FREE έκδοση.
      ADD_LINK: Προσθήκη συνδέσμου
      LINK_ENABLED: Ενεργός
      LINK_TITLE: Τίτλος συνδέσμου
      LINK_TITLE_HELP: Το κείμενο που εμφανίζεται στο κουμπί του συνδέσμου.
      LINK_URL: URL συνδέσμου
      LINK_URL_HELP: Ο πλήρης προορισμός HTTP ή HTTPS.
      LINK_NEW_TAB: Άνοιγμα σε νέα καρτέλα
      LINK_NEW_TAB_HELP: Άνοιγμα του προορισμού σε ξεχωριστή καρτέλα.

name: Goosialize Links
slug: goosialize-links
type: plugin
version: 1.0.0
description: 'Self-hosted Link in Bio plugin for Grav CMS.'
icon: link
author:
  name: Goosialize Ltd
  email: agency@goosialize.com
  url: https://goosialize.com
homepage: https://github.com/goosialize/goosialize-links
bugs: https://github.com/goosialize/goosialize-links/issues
docs: https://github.com/goosialize/goosialize-links#readme
keywords: grav, plugin, link in bio, self-hosted
license: MIT
dependencies:
  - name: grav
    version: '>=2.0.12'
  - name: admin2
    version: '>=2.0.15'
  - name: api
    version: '>=1.0.12'
compatibility:
  grav:
    - '2.0'

form:
  validation: strict
  fields:
    route:
      type: hidden

    enabled:
      type: toggle
      label: PLUGIN_GOOSIALIZE_LINKS.STATUS
      help: PLUGIN_GOOSIALIZE_LINKS.STATUS_HELP
      highlight: 1
      default: 1
      options:
        1: PLUGIN_GOOSIALIZE_LINKS.ENABLED
        0: PLUGIN_GOOSIALIZE_LINKS.DISABLED
      validate:
        type: bool

    native_page_notice:
      type: display
      label: PLUGIN_GOOSIALIZE_LINKS.NATIVE_PAGE_NOTICE
      markdown: true
      content: PLUGIN_GOOSIALIZE_LINKS.NATIVE_PAGE_NOTICE_HELP

    editor_preview:
      type: goosialize-links-preview
      label: PLUGIN_GOOSIALIZE_LINKS.LIVE_PREVIEW
      help: PLUGIN_GOOSIALIZE_LINKS.PREVIEW_HELP

    profile_section:
      type: fieldset
      title: PLUGIN_GOOSIALIZE_LINKS.PROFILE_SECTION
      collapsible: true
      collapsed: false
      fields:
        profile_section_help:
          type: display
          content: PLUGIN_GOOSIALIZE_LINKS.PROFILE_SECTION_HELP

        profile.image:
          type: file
          label: PLUGIN_GOOSIALIZE_LINKS.PROFILE_IMAGE
          help: PLUGIN_GOOSIALIZE_LINKS.PROFILE_IMAGE_HELP
          destination: user://media/goosialize-links/profile
          multiple: false
          limit: 1
          random_name: true
          avoid_overwriting: true
          accept:
            - image/jpeg
            - image/png
            - image/webp

        profile.name:
          type: hidden
        profile.title:
          type: hidden
        profile.description:
          type: hidden
        profile.translations:
          type: hidden

        profile.website_url:
          type: url
          label: PLUGIN_GOOSIALIZE_LINKS.PROFILE_WEBSITE_URL
          help: PLUGIN_GOOSIALIZE_LINKS.PROFILE_WEBSITE_URL_HELP
          placeholder: https://example.com

    business_information_section:
      type: fieldset
      title: PLUGIN_GOOSIALIZE_LINKS.BUSINESS_INFORMATION_SECTION
      collapsible: true
      collapsed: true
      fields:
        business_information_help:
          type: display
          content: PLUGIN_GOOSIALIZE_LINKS.BUSINESS_INFORMATION_HELP

        business.working_hours.configured:
          type: toggle
          label: PLUGIN_GOOSIALIZE_LINKS.ENABLE_WORKING_HOURS
          help: PLUGIN_GOOSIALIZE_LINKS.WORKING_HOURS_HELP
          highlight: 1
          default: 0
          options:
            1: PLUGIN_GOOSIALIZE_LINKS.ENABLED
            0: PLUGIN_GOOSIALIZE_LINKS.DISABLED
          validate:
            type: bool

        working_hours_heading:
          type: section
          title: PLUGIN_GOOSIALIZE_LINKS.WORKING_HOURS

        business_monday_row:
          type: columns
          fields:
            business_monday_label:
              type: column
              fields:
                business_monday_heading:
                  type: display
                  content: PLUGIN_GOOSIALIZE_LINKS.MONDAY
            business_monday_enabled_column:
              type: column
              fields:
                business.working_hours.monday.enabled:
                  type: toggle
                  label: PLUGIN_GOOSIALIZE_LINKS.OPEN
                  highlight: 1
                  default: 0
                  options:
                    1: PLUGIN_GOOSIALIZE_LINKS.OPEN
                    0: PLUGIN_GOOSIALIZE_LINKS.CLOSED
                  validate:
                    type: bool
            business_monday_open_column:
              type: column
              fields:
                business.working_hours.monday.open:
                  type: time
                  label: PLUGIN_GOOSIALIZE_LINKS.OPENING_TIME
                  step: 60
            business_monday_close_column:
              type: column
              fields:
                business.working_hours.monday.close:
                  type: time
                  label: PLUGIN_GOOSIALIZE_LINKS.CLOSING_TIME
                  step: 60

        business_tuesday_row:
          type: columns
          fields:
            business_tuesday_label:
              type: column
              fields:
                business_tuesday_heading:
                  type: display
                  content: PLUGIN_GOOSIALIZE_LINKS.TUESDAY
            business_tuesday_enabled_column:
              type: column
              fields:
                business.working_hours.tuesday.enabled:
                  type: toggle
                  label: PLUGIN_GOOSIALIZE_LINKS.OPEN
                  highlight: 1
                  default: 0
                  options:
                    1: PLUGIN_GOOSIALIZE_LINKS.OPEN
                    0: PLUGIN_GOOSIALIZE_LINKS.CLOSED
                  validate:
                    type: bool
            business_tuesday_open_column:
              type: column
              fields:
                business.working_hours.tuesday.open:
                  type: time
                  label: PLUGIN_GOOSIALIZE_LINKS.OPENING_TIME
                  step: 60
            business_tuesday_close_column:
              type: column
              fields:
                business.working_hours.tuesday.close:
                  type: time
                  label: PLUGIN_GOOSIALIZE_LINKS.CLOSING_TIME
                  step: 60

        business_wednesday_row:
          type: columns
          fields:
            business_wednesday_label:
              type: column
              fields:
                business_wednesday_heading:
                  type: display
                  content: PLUGIN_GOOSIALIZE_LINKS.WEDNESDAY
            business_wednesday_enabled_column:
              type: column
              fields:
                business.working_hours.wednesday.enabled:
                  type: toggle
                  label: PLUGIN_GOOSIALIZE_LINKS.OPEN
                  highlight: 1
                  default: 0
                  options:
                    1: PLUGIN_GOOSIALIZE_LINKS.OPEN
                    0: PLUGIN_GOOSIALIZE_LINKS.CLOSED
                  validate:
                    type: bool
            business_wednesday_open_column:
              type: column
              fields:
                business.working_hours.wednesday.open:
                  type: time
                  label: PLUGIN_GOOSIALIZE_LINKS.OPENING_TIME
                  step: 60
            business_wednesday_close_column:
              type: column
              fields:
                business.working_hours.wednesday.close:
                  type: time
                  label: PLUGIN_GOOSIALIZE_LINKS.CLOSING_TIME
                  step: 60

        business_thursday_row:
          type: columns
          fields:
            business_thursday_label:
              type: column
              fields:
                business_thursday_heading:
                  type: display
                  content: PLUGIN_GOOSIALIZE_LINKS.THURSDAY
            business_thursday_enabled_column:
              type: column
              fields:
                business.working_hours.thursday.enabled:
                  type: toggle
                  label: PLUGIN_GOOSIALIZE_LINKS.OPEN
                  highlight: 1
                  default: 0
                  options:
                    1: PLUGIN_GOOSIALIZE_LINKS.OPEN
                    0: PLUGIN_GOOSIALIZE_LINKS.CLOSED
                  validate:
                    type: bool
            business_thursday_open_column:
              type: column
              fields:
                business.working_hours.thursday.open:
                  type: time
                  label: PLUGIN_GOOSIALIZE_LINKS.OPENING_TIME
                  step: 60
            business_thursday_close_column:
              type: column
              fields:
                business.working_hours.thursday.close:
                  type: time
                  label: PLUGIN_GOOSIALIZE_LINKS.CLOSING_TIME
                  step: 60

        business_friday_row:
          type: columns
          fields:
            business_friday_label:
              type: column
              fields:
                business_friday_heading:
                  type: display
                  content: PLUGIN_GOOSIALIZE_LINKS.FRIDAY
            business_friday_enabled_column:
              type: column
              fields:
                business.working_hours.friday.enabled:
                  type: toggle
                  label: PLUGIN_GOOSIALIZE_LINKS.OPEN
                  highlight: 1
                  default: 0
                  options:
                    1: PLUGIN_GOOSIALIZE_LINKS.OPEN
                    0: PLUGIN_GOOSIALIZE_LINKS.CLOSED
                  validate:
                    type: bool
            business_friday_open_column:
              type: column
              fields:
                business.working_hours.friday.open:
                  type: time
                  label: PLUGIN_GOOSIALIZE_LINKS.OPENING_TIME
                  step: 60
            business_friday_close_column:
              type: column
              fields:
                business.working_hours.friday.close:
                  type: time
                  label: PLUGIN_GOOSIALIZE_LINKS.CLOSING_TIME
                  step: 60

        business_saturday_row:
          type: columns
          fields:
            business_saturday_label:
              type: column
              fields:
                business_saturday_heading:
                  type: display
                  content: PLUGIN_GOOSIALIZE_LINKS.SATURDAY
            business_saturday_enabled_column:
              type: column
              fields:
                business.working_hours.saturday.enabled:
                  type: toggle
                  label: PLUGIN_GOOSIALIZE_LINKS.OPEN
                  highlight: 1
                  default: 0
                  options:
                    1: PLUGIN_GOOSIALIZE_LINKS.OPEN
                    0: PLUGIN_GOOSIALIZE_LINKS.CLOSED
                  validate:
                    type: bool
            business_saturday_open_column:
              type: column
              fields:
                business.working_hours.saturday.open:
                  type: time
                  label: PLUGIN_GOOSIALIZE_LINKS.OPENING_TIME
                  step: 60
            business_saturday_close_column:
              type: column
              fields:
                business.working_hours.saturday.close:
                  type: time
                  label: PLUGIN_GOOSIALIZE_LINKS.CLOSING_TIME
                  step: 60

        business_sunday_row:
          type: columns
          fields:
            business_sunday_label:
              type: column
              fields:
                business_sunday_heading:
                  type: display
                  content: PLUGIN_GOOSIALIZE_LINKS.SUNDAY
            business_sunday_enabled_column:
              type: column
              fields:
                business.working_hours.sunday.enabled:
                  type: toggle
                  label: PLUGIN_GOOSIALIZE_LINKS.OPEN
                  highlight: 1
                  default: 0
                  options:
                    1: PLUGIN_GOOSIALIZE_LINKS.OPEN
                    0: PLUGIN_GOOSIALIZE_LINKS.CLOSED
                  validate:
                    type: bool
            business_sunday_open_column:
              type: column
              fields:
                business.working_hours.sunday.open:
                  type: time
                  label: PLUGIN_GOOSIALIZE_LINKS.OPENING_TIME
                  step: 60
            business_sunday_close_column:
              type: column
              fields:
                business.working_hours.sunday.close:
                  type: time
                  label: PLUGIN_GOOSIALIZE_LINKS.CLOSING_TIME
                  step: 60

        business.google_maps_url:
          type: url
          label: PLUGIN_GOOSIALIZE_LINKS.GOOGLE_MAPS_URL
          help: PLUGIN_GOOSIALIZE_LINKS.GOOGLE_MAPS_URL_HELP
          placeholder: https://www.google.com/maps/...

    appearance_section:
      type: fieldset
      title: PLUGIN_GOOSIALIZE_LINKS.APPEARANCE_SECTION
      collapsible: true
      collapsed: true
      fields:
        appearance_section_help:
          type: display
          content: PLUGIN_GOOSIALIZE_LINKS.APPEARANCE_SECTION_HELP

        appearance.theme:
          type: select
          label: PLUGIN_GOOSIALIZE_LINKS.THEME
          help: PLUGIN_GOOSIALIZE_LINKS.THEME_HELP
          default: light
          options:
            light: PLUGIN_GOOSIALIZE_LINKS.THEME_LIGHT
            dark: PLUGIN_GOOSIALIZE_LINKS.THEME_DARK
            sunrise: PLUGIN_GOOSIALIZE_LINKS.THEME_SUNRISE

        appearance.accent:
          type: select
          label: PLUGIN_GOOSIALIZE_LINKS.ACCENT
          help: PLUGIN_GOOSIALIZE_LINKS.ACCENT_HELP
          default: yellow
          options:
            yellow: PLUGIN_GOOSIALIZE_LINKS.ACCENT_YELLOW
            blue: PLUGIN_GOOSIALIZE_LINKS.ACCENT_BLUE
            coral: PLUGIN_GOOSIALIZE_LINKS.ACCENT_CORAL
            green: PLUGIN_GOOSIALIZE_LINKS.ACCENT_GREEN
            purple: PLUGIN_GOOSIALIZE_LINKS.ACCENT_PURPLE

        appearance.button_shape:
          type: select
          label: PLUGIN_GOOSIALIZE_LINKS.BUTTON_SHAPE
          help: PLUGIN_GOOSIALIZE_LINKS.BUTTON_SHAPE_HELP
          default: rounded
          options:
            square: PLUGIN_GOOSIALIZE_LINKS.BUTTON_SQUARE
            rounded: PLUGIN_GOOSIALIZE_LINKS.BUTTON_ROUNDED
            pill: PLUGIN_GOOSIALIZE_LINKS.BUTTON_PILL

    actions_section:
      type: fieldset
      title: PLUGIN_GOOSIALIZE_LINKS.ACTIONS_SECTION
      collapsible: true
      collapsed: true
      fields:
        actions_section_help:
          type: display
          content: PLUGIN_GOOSIALIZE_LINKS.ACTIONS_SECTION_HELP

        actions:
          type: list
          label: PLUGIN_GOOSIALIZE_LINKS.ACTIONS
          help: PLUGIN_GOOSIALIZE_LINKS.ACTIONS_HELP
          style: vertical
          collapsed: true
          controls: both
          placement: bottom
          key: type
          btnLabel: PLUGIN_GOOSIALIZE_LINKS.ADD_ACTION
          fields:
            .id:
              type: hidden

            .enabled:
              type: toggle
              label: PLUGIN_GOOSIALIZE_LINKS.ACTION_ENABLED
              highlight: 1
              default: 1
              options:
                1: PLUGIN_GOOSIALIZE_LINKS.ENABLED
                0: PLUGIN_GOOSIALIZE_LINKS.DISABLED
              validate:
                type: bool

            .type:
              type: select
              label: PLUGIN_GOOSIALIZE_LINKS.ACTION_TYPE
              default: website
              options:
                website: PLUGIN_GOOSIALIZE_LINKS.ACTION_WEBSITE
                instagram: PLUGIN_GOOSIALIZE_LINKS.ACTION_INSTAGRAM
                facebook: PLUGIN_GOOSIALIZE_LINKS.ACTION_FACEBOOK
                tiktok: PLUGIN_GOOSIALIZE_LINKS.ACTION_TIKTOK
                youtube: PLUGIN_GOOSIALIZE_LINKS.ACTION_YOUTUBE
                linkedin: PLUGIN_GOOSIALIZE_LINKS.ACTION_LINKEDIN
                x: PLUGIN_GOOSIALIZE_LINKS.ACTION_X
                email: PLUGIN_GOOSIALIZE_LINKS.ACTION_EMAIL
                phone: PLUGIN_GOOSIALIZE_LINKS.ACTION_PHONE
                whatsapp: PLUGIN_GOOSIALIZE_LINKS.ACTION_WHATSAPP

            .value:
              type: text
              label: PLUGIN_GOOSIALIZE_LINKS.ACTION_VALUE
              help: PLUGIN_GOOSIALIZE_LINKS.ACTION_VALUE_HELP
              validate:
                required: true

            .label:
              type: hidden
            .translations:
              type: hidden

    links_section:
      type: fieldset
      title: PLUGIN_GOOSIALIZE_LINKS.LINKS_SECTION
      collapsible: true
      collapsed: true
      fields:
        links_section_help:
          type: display
          content: PLUGIN_GOOSIALIZE_LINKS.LINKS_SECTION_HELP

        links:
          type: list
          label: PLUGIN_GOOSIALIZE_LINKS.LINKS
          help: PLUGIN_GOOSIALIZE_LINKS.LINKS_HELP
          style: vertical
          collapsed: true
          controls: both
          placement: bottom
          key: url
          btnLabel: PLUGIN_GOOSIALIZE_LINKS.ADD_LINK
          fields:
            .id:
              type: hidden

            .enabled:
              type: toggle
              label: PLUGIN_GOOSIALIZE_LINKS.LINK_ENABLED
              highlight: 1
              default: 1
              options:
                1: PLUGIN_GOOSIALIZE_LINKS.ENABLED
                0: PLUGIN_GOOSIALIZE_LINKS.DISABLED
              validate:
                type: bool

            .title:
              type: hidden
            .translations:
              type: hidden

            .url:
              type: url
              label: PLUGIN_GOOSIALIZE_LINKS.LINK_URL
              help: PLUGIN_GOOSIALIZE_LINKS.LINK_URL_HELP
              placeholder: https://example.com
              validate:
                required: true

            .new_tab:
              type: toggle
              label: PLUGIN_GOOSIALIZE_LINKS.LINK_NEW_TAB
              help: PLUGIN_GOOSIALIZE_LINKS.LINK_NEW_TAB_HELP
              highlight: 1
              default: 1
              options:
                1: PLUGIN_GOOSIALIZE_LINKS.ENABLED
                0: PLUGIN_GOOSIALIZE_LINKS.DISABLED
              validate:
                type: bool
